<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors & Staff – MedTrack Hospital System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="page-body">
        <div class="page-header">
          <div class="page-title">
            <h1>Specialist Doctors & Medical Staff</h1>
            <p>Doctor credentials, departmental assignments, consultation fees and weekly duty rosters.</p>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Registered Medical Faculty</h3>
            <span class="badge badge-primary">Certified Practitioners</span>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Doctor ID</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Assigned Branch</th>
                  <th>Experience</th>
                  <th>Consultation Fee</th>
                  <th>Availability</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="doctors-tbody">
                <!-- Dynamically populated by js/doctors.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/doctors.js"></script>
</body>
</html>
