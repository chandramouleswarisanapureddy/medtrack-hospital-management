<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Dashboard – MedTrack Hospital System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="page-body">
        <div class="page-header">
          <div class="page-title">
            <h1>Clinical Operations Dashboard</h1>
            <p>Real-time cross-branch monitoring, appointment queues & critical medical alerts.</p>
          </div>
          <div>
            <a href="appointments.html" class="btn btn-primary">+ Book Appointment</a>
            <a href="emergency.html" class="btn btn-danger" style="margin-left: 8px;">Declare Emergency</a>
          </div>
        </div>

        <!-- Metric KPI Cards -->
        <div class="kpi-grid" id="dashboard-kpis">
          <!-- Dynamically populated by js/dashboard.js -->
        </div>

        <!-- Multi-Branch Status Grid -->
        <div style="margin-bottom: 30px;">
          <h3 style="margin-bottom: 16px;">Branch Facilities Overview</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;" id="branch-overview-grid">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Recent Appointments Queue Table -->
        <div class="card">
          <div class="card-header">
            <h3>Recent Appointments & Queue</h3>
            <a href="appointments.html" class="btn btn-sm btn-outline">View Complete Queue &rarr;</a>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Appt #</th>
                  <th>Patient</th>
                  <th>Doctor</th>
                  <th>Branch</th>
                  <th>Schedule</th>
                  <th>Status</th>
                  <th>AI No-Show Risk</th>
                </tr>
              </thead>
              <tbody id="recent-appointments-tbody">
                <!-- Dynamically populated by js/dashboard.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
